<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מעקב אימון כוח</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<body>
<header>
  <div class="header-inner">
    <div>
      <div class="brand">מעקב אימון כוח</div>
      <div class="brand-sub">אימון גוף מלא · היעד של היום בכל תרגיל</div>
    </div>
    <div class="header-date" id="headerDate"></div>
  </div>
</header>

<nav>
  <button class="tab active" data-tab="workout">האימון היום</button>
  <button class="tab" data-tab="history">היסטוריה</button>
</nav>

<main>
  <section id="panel-workout" class="panel active"></section>
  <section id="panel-history" class="panel"></section>
</main>

<script>
const STORAGE_KEY='gym_history_v1';

const GROUPS=[
  {
    id:'back',name:'גב',color:'#2f8cff',soft:'#eaf3ff',increment:5,
    exercises:[
      {id:'lat_pulldown',name:'Lat Pulldown',nameHe:'משיכה עליונה'},
      {id:'seated_row',name:'Seated Row',nameHe:'חתירה בישיבה'},
      {id:'dumbbell_row',name:'Dumbbell Row',nameHe:'חתירה עם דאמבל',weightLabel:'ק"ג לכל יד'}
    ]
  },
  {
    id:'chest',name:'חזה',color:'#21a66a',soft:'#eaf8f1',increment:2.5,
    exercises:[
      {id:'chest_press_machine',name:'Chest Press Machine',nameHe:'לחיצת חזה במכונה'},
      {id:'dumbbell_chest_press',name:'Dumbbell Chest Press',nameHe:'לחיצת חזה עם דאמבלים',weightLabel:'ק"ג לכל יד'},
      {id:'pec_deck',name:'Pec Deck',nameHe:'פרפר במכונה'}
    ]
  },
  {
    id:'shoulders',name:'כתפיים',color:'#8a48c7',soft:'#f3ebfb',increment:2.5,
    exercises:[
      {id:'shoulder_press_machine',name:'Shoulder Press Machine',nameHe:'לחיצת כתפיים במכונה'},
      {id:'dumbbell_shoulder_press',name:'Dumbbell Shoulder Press',nameHe:'לחיצת כתפיים עם דאמבלים',weightLabel:'ק"ג לכל יד'},
      {id:'kettlebell_shoulder_press',name:'Kettlebell Shoulder Press',nameHe:'לחיצת כתפיים עם קטלבל',weightLabel:'ק"ג לכל יד'}
    ]
  },
  {
    id:'quads',name:'ארבע ראשי',color:'#f0ad23',soft:'#fff6df',increment:5,
    exercises:[
      {id:'leg_press',name:'Leg Press',nameHe:'לחיצת רגליים'},
      {id:'goblet_squat',name:'Goblet Squat',nameHe:'סקוואט גביע'},
      {id:'leg_extension',name:'Leg Extension',nameHe:'פשיטת ברך במכונה'}
    ]
  },
  {
    id:'posterior',name:'ירך אחורית וישבן',color:'#18a9a0',soft:'#e7f8f7',increment:5,
    exercises:[
      {id:'leg_curl',name:'Leg Curl',nameHe:'כפיפת ברך במכונה'},
      {id:'romanian_deadlift',name:'Romanian Deadlift',nameHe:'דדליפט רומני'},
      {id:'hip_thrust',name:'Hip Thrust',nameHe:'הרמת אגן'}
    ]
  },
  {
    id:'biceps',name:'יד קדמית',color:'#df3f82',soft:'#fdebf3',increment:2.5,
    exercises:[
      {id:'dumbbell_curl',name:'Dumbbell Curl',nameHe:'כפיפת מרפק עם דאמבלים',weightLabel:'ק"ג לכל יד'}
    ]
  },
  {
    id:'triceps',name:'יד אחורית',color:'#e4664e',soft:'#fff0ed',increment:2.5,
    exercises:[
      {id:'tricep_pushdown',name:'Tricep Pushdown',nameHe:'פשיטת מרפק בכבל'}
    ]
  },
  {
    id:'core',name:'ליבה',color:'#4a154b',soft:'#f2e9f2',increment:0,
    exercises:[
      {id:'plank',name:'Plank',nameHe:'פלאנק',noWeight:true,repsLabel:'שניות'},
      {id:'tabata_abs',name:'Tabata Abs',nameHe:'טאבטה בטן',noWeight:true,repsLabel:'סבבים'}
    ]
  }
];

let workoutState={};
let currentGroupId=null;

function loadHistory(){
  try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}
  catch{return []}
}
function saveHistory(data){localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}
function todayStr(){return new Date().toISOString().slice(0,10)}
function fmtDate(v){
  if(!v)return '';
  const [y,m,d]=v.split('-');return `${d}/${m}/${y}`;
}
function slug(v){return String(v).toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')}
function groupById(id){return GROUPS.find(g=>g.id===id)}
function exerciseById(id){
  for(const g of GROUPS){
    const e=g.exercises.find(x=>x.id===id);
    if(e)return {...e,group:g};
  }
  return null;
}
function normalizeLegacyExercise(ex){
  if(ex.exerciseId)return ex;
  const all=GROUPS.flatMap(g=>g.exercises.map(e=>({...e,group:g})));
  const match=all.find(x=>x.name===ex.name);
  return {...ex,exerciseId:match?.id||slug(ex.name||''),groupId:match?.group.id||ex.category||''};
}
function getExerciseHistory(exerciseId){
  const rows=[];
  loadHistory().forEach(session=>{
    (session.exercises||[]).forEach(raw=>{
      const ex=normalizeLegacyExercise(raw);
      if(ex.exerciseId===exerciseId && ex.completed!==false){
        rows.push({...ex,date:session.date,sessionId:session.id});
      }
    });
  });
  return rows.sort((a,b)=>{
    const d=new Date(b.date)-new Date(a.date);
    return d!==0?d:(b.sessionId||0)-(a.sessionId||0);
  });
}

function muscleSvg(groupId){
  const common='fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"';
  const svgs={
    back:`<svg viewBox="0 0 48 48" aria-hidden="true"><path ${common} d="M16 8c2 4 2 7 1 10-2 5-5 9-4 17m19-27c-2 4-2 7-1 10 2 5 5 9 4 17M20 10c1 3 1 6 0 9l-3 8m11-17c-1 3-1 6 0 9l3 8M19 19c3 2 7 2 10 0M17 28c4 3 10 3 14 0M24 7v27"/></svg>`,
    chest:`<svg viewBox="0 0 48 48" aria-hidden="true"><path ${common} d="M14 10c3 4 6 6 10 6s7-2 10-6M13 13c-3 6-4 12-2 20m24-20c3 6 4 12 2 20M12 24c5-3 8-4 12-4s7 1 12 4M24 16v18"/></svg>`,
    shoulders:`<svg viewBox="0 0 48 48" aria-hidden="true"><path ${common} d="M14 13c3 2 6 3 10 3s7-1 10-3M14 13c-4 2-7 6-8 11m28-11c4 2 7 6 8 11M15 14c1 7 0 13-2 20m20-20c-1 7 0 13 2 20M20 16v18m8-18v18"/></svg>`,
    quads:`<svg viewBox="0 0 48 48" aria-hidden="true"><path ${common} d="M18 7c1 8 0 14-2 20l-2 14m16-34c-1 8 0 14 2 20l2 14M18 18c4 2 8 2 12 0M17 27c5 2 9 2 14 0M24 8v31"/></svg>`,
    posterior:`<svg viewBox="0 0 48 48" aria-hidden="true"><path ${common} d="M18 7c-1 7-1 13 1 19l-3 15m14-34c1 7 1 13-1 19l3 15M19 13c3 3 7 3 10 0M19 26c3 2 7 2 10 0M24 13v25"/></svg>`,
    biceps:`<svg viewBox="0 0 48 48" aria-hidden="true"><path ${common} d="M13 31c5 0 7-3 8-8 1-4 3-7 7-7 3 0 5 2 6 5m-21 10c4 6 10 8 16 5 5-2 8-7 8-13M17 18l-4 13m15-15 2-7"/></svg>`,
    triceps:`<svg viewBox="0 0 48 48" aria-hidden="true"><path ${common} d="M15 16c5 0 8 3 9 8 1 5 3 8 8 8m-17-16c1 10 7 18 17 16m-4-16-3-7m7 23 4-12"/></svg>`,
    core:`<svg viewBox="0 0 48 48" aria-hidden="true"><path ${common} d="M16 8c2 5 2 9 1 13-1 5-2 10 0 19m15-32c-2 5-2 9-1 13 1 5 2 10 0 19M18 16h12M18 24h12M19 32h10M24 10v28"/></svg>`
  };
  return svgs[groupId]||svgs.core;
}

function getGoal(exerciseId){
  const ex=exerciseById(exerciseId);
  const hist=getExerciseHistory(exerciseId);
  if(!hist.length){
    return {
      weight:'',
      reps:8,
      text:ex.noWeight
        ? `התחל ביעד נוח של 8 ${ex.repsLabel}.`
        : 'אין עדיין נתונים. התחל במשקל נוח ל־8 חזרות.',
      short:'התחלה: 8 חזרות',
      cls:'rec-neutral'
    };
  }

  const last=hist[0];
  const prev=hist[1];
  const lastRpe=Number(last.rpe);
  const lastReps=Number(last.reps);
  const lastWeight=Number(last.weight);

  if(lastRpe>=9){
    return {
      weight:ex.noWeight?'':lastWeight,
      reps:Math.max(1,lastReps-(ex.noWeight?5:1)),
      text:ex.noWeight
        ? 'המאמץ הקודם היה גבוה. הפחת זמן או סבבים היום.'
        : 'המאמץ הקודם היה גבוה. הפחת מעט משקל או 1–2 חזרות היום.',
      short:'יעד: להפחית עומס',
      cls:'rec-danger'
    };
  }

  const repeated=prev &&
    Number(prev.rpe)>0 && Number(prev.rpe)<=8 &&
    Number(prev.reps)===lastReps &&
    (ex.noWeight || Number(prev.weight)===lastWeight);

  if(ex.noWeight){
    if(repeated){
      const step=exerciseId==='plank'?5:1;
      return {
        weight:'',
        reps:lastReps+step,
        text:`היעד היום: ${lastReps+step} ${ex.repsLabel}.`,
        short:`יעד: ${lastReps+step} ${ex.repsLabel}`,
        cls:'rec-good'
      };
    }
    return {
      weight:'',
      reps:lastReps,
      text:`חזור היום על ${lastReps} ${ex.repsLabel}. ביצוע מוצלח נוסף יאפשר התקדמות.`,
      short:`יעד: ${lastReps} ${ex.repsLabel}`,
      cls:'rec-warn'
    };
  }

  if(lastReps<12){
    if(repeated){
      return {
        weight:lastWeight,reps:lastReps+1,
        text:`היעד היום: ${lastWeight} ${ex.weightLabel||'ק"ג'} ל־${lastReps+1} חזרות.`,
        short:`יעד: ${lastReps+1} חזרות`,
        cls:'rec-good'
      };
    }
    return {
      weight:lastWeight,reps:lastReps,
      text:`חזור היום על ${lastWeight} ${ex.weightLabel||'ק"ג'} ל־${lastReps} חזרות. ביצוע מוצלח נוסף יאפשר להעלות חזרה.`,
      short:`יעד: חזרה על ${lastReps}`,
      cls:'rec-warn'
    };
  }

  if(repeated){
    return {
      weight:lastWeight+ex.group.increment,reps:8,
      text:`היעד היום: העלה ל־${lastWeight+ex.group.increment} ${ex.weightLabel||'ק"ג'} וחזור ל־8 חזרות.`,
      short:`יעד: ${lastWeight+ex.group.increment} ק"ג × 8`,
      cls:'rec-good'
    };
  }

  return {
    weight:lastWeight,reps:12,
    text:`חזור היום על ${lastWeight} ${ex.weightLabel||'ק"ג'} ל־12 חזרות. ביצוע מוצלח נוסף יאפשר העלאת משקל.`,
    short:'יעד: חזרה על 12',
    cls:'rec-warn'
  };
}

function currentRecommendation(ex,current){
  const reps=Number(current.reps);
  const rpe=Number(current.rpe);
  const weight=Number(current.weight);
  if(!reps||!rpe)return {text:'הזן את כל נתוני האימון כדי לקבל המלצה.',cls:'rec-neutral'};

  if(rpe>=9){
    return {
      text:ex.noWeight
        ? 'המאמץ גבוה מדי. בפעם הבאה הפחת זמן או מספר סבבים.'
        : reps<8
          ? 'המאמץ גבוה מדי. בפעם הבאה הפחת משקל.'
          : 'המאמץ גבוה מדי. בפעם הבאה הפחת מעט משקל או 1–2 חזרות.',
      cls:'rec-danger'
    };
  }

  const hist=getExerciseHistory(ex.id);
  const prev=hist[0];
  const samePrevious=prev &&
    Number(prev.rpe)>0 && Number(prev.rpe)<=8 &&
    Number(prev.reps)===reps &&
    (ex.noWeight||Number(prev.weight)===weight);

  if(ex.noWeight){
    if(samePrevious){
      const step=ex.id==='plank'?5:1;
      return {text:`ביצוע מוצלח נוסף. בפעם הבאה העלה ל־${reps+step} ${ex.repsLabel}.`,cls:'rec-good'};
    }
    return {text:'ביצוע טוב. חזור פעם נוספת על אותו יעד לפני התקדמות.',cls:'rec-warn'};
  }

  if(reps<12){
    if(samePrevious){
      return {text:`בפעם הבאה העלה ל־${reps+1} חזרות באותו משקל.`,cls:'rec-good'};
    }
    return {text:'ביצוע טוב. חזור פעם נוספת על אותו משקל ומספר חזרות.',cls:'rec-warn'};
  }

  if(samePrevious){
    return {text:`בפעם הבאה העלה משקל ב־${ex.group.increment} ק"ג וחזור ל־8 חזרות.`,cls:'rec-good'};
  }
  return {text:'הגעת ל־12 חזרות. חזור פעם נוספת לפני העלאת משקל.',cls:'rec-warn'};
}

function renderWorkout(){
  const panel=document.getElementById('panel-workout');
  panel.innerHTML=`
    <div class="dashboard-view" id="dashboardView">
      <div class="top-card">
        <div class="meta-grid">
          <div class="field">
            <label>תאריך</label>
            <input id="sessionDate" type="date" value="${todayStr()}">
          </div>
          <div class="field">
            <label>משקל גוף (ק"ג)</label>
            <input id="bodyWeight" type="number" step="0.1" min="0" placeholder="לא חובה">
          </div>
          <div class="field">
            <label>אחוז שומן</label>
            <input id="bodyFat" type="number" step="0.1" min="0" max="70" placeholder="לא חובה">
          </div>
        </div>
      </div>

      <div class="progress-card">
        <div>
          <div class="progress-title">התקדמות באימון</div>
          <div class="progress-value" id="progressValue">0 מתוך 8</div>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      </div>

      <div class="section-title">קבוצות השרירים</div>
      <div class="section-sub">בחר את הקבוצה הבאה לפי הסדר שנוח לך. בסיום כל תרגיל חוזרים למסך הזה.</div>

      <div class="dashboard" id="dashboard">
        ${GROUPS.map(buildGroupCard).join('')}
      </div>

      <div class="finish-card">
        <div class="finish-title">סיכום האימון</div>
        <div class="finish-sub">מלא בסיום, לפני שמירת האימון.</div>
        <div class="finish-grid">
          <div class="field">
            <span class="field-title">איך היה האימון?</span>
            <div class="rating-row" id="ratingRow">
              ${[1,2,3,4,5].map(n=>`<button type="button" class="rating-dot" data-value="${n}">${n}</button>`).join('')}
            </div>
          </div>
          <div class="field full">
            <label>הערה לאימון</label>
            <textarea id="sessionNote" rows="3" placeholder="איך הרגשת? מה היה קל או קשה? מה כדאי לזכור לפעם הבאה?"></textarea>
          </div>
        </div>
        <div class="save-row">
          <button class="btn btn-primary" id="saveWorkoutBtn">שמור אימון</button>
          <button class="btn btn-secondary" id="resetWorkoutBtn">נקה אימון</button>
          <span class="save-message" id="saveMessage">✓ האימון נשמר</span>
        </div>
      </div>
    </div>

    <div class="detail-view" id="detailView"></div>
  `;

  document.querySelectorAll('.group-card').forEach(card=>{
    card.addEventListener('click',()=>openGroup(card.dataset.group));
  });
  document.querySelectorAll('.rating-dot').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.rating-dot').forEach(x=>x.classList.remove('selected'));
      btn.classList.add('selected');
    });
  });
  document.getElementById('saveWorkoutBtn').addEventListener('click',saveWorkout);
  document.getElementById('resetWorkoutBtn').addEventListener('click',()=>{
    if(confirm('לנקות את נתוני האימון הנוכחי?')){
      workoutState={};renderWorkout();
    }
  });
  updateDashboard();
}

function buildGroupCard(group){
  return `
  <article class="group-card" data-group="${group.id}" id="groupCard-${group.id}"
    style="--group:${group.color};--soft:${group.soft}">
    <div class="group-top">
      <div class="group-id">
        <div class="muscle-illustration">${muscleSvg(group.id)}</div>
        <div>
          <div class="group-name">${group.name}</div>
          <div class="group-count">${group.exercises.length} ${group.exercises.length===1?'תרגיל':'אפשרויות'}</div>
        </div>
      </div>
      <div class="status-badge" id="status-${group.id}">○</div>
    </div>
    <div class="group-summary" id="summary-${group.id}">
      בחר תרגיל והתחל
    </div>
  </article>`;
}

function updateDashboard(){
  let completed=0;
  GROUPS.forEach(group=>{
    const card=document.getElementById(`groupCard-${group.id}`);
    const status=document.getElementById(`status-${group.id}`);
    const summary=document.getElementById(`summary-${group.id}`);
    if(!card||!status||!summary)return;

    card.classList.remove('completed','in-progress');
    const state=workoutState[group.id];
    if(state?.completed){
      completed++;
      card.classList.add('completed');
      status.textContent='✓';
      const ex=exerciseById(state.exerciseId);
      summary.innerHTML=`<strong>${ex.nameHe}</strong> · ${ex.noWeight?'':state.weight+' '+(ex.weightLabel||'ק"ג')+' · '}${state.reps} ${ex.repsLabel||'חזרות'} · RPE ${state.rpe}
      <div class="goal-mini">הושלם</div>`;
    }else if(state?.exerciseId){
      card.classList.add('in-progress');
      status.textContent='•';
      const ex=exerciseById(state.exerciseId);
      const goal=getGoal(state.exerciseId);
      summary.innerHTML=`<strong>${ex.nameHe}</strong><div class="goal-mini">${goal.short}</div>`;
    }else{
      status.textContent='○';
      summary.textContent='בחר תרגיל והתחל';
    }
  });
  document.getElementById('progressValue').textContent=`${completed} מתוך 8`;
  document.getElementById('progressFill').style.width=`${completed/8*100}%`;
}

function openGroup(groupId){
  currentGroupId=groupId;
  const group=groupById(groupId);
  const state=workoutState[groupId]||{};
  const detail=document.getElementById('detailView');
  const dashboard=document.getElementById('dashboardView');

  detail.innerHTML=`
    <button class="back-button" id="backToDashboard">← חזרה לכל קבוצות השרירים</button>
    <div class="detail-card" style="--group:${group.color};--soft:${group.soft}">
      <div class="detail-head">
        <div class="muscle-illustration">${muscleSvg(group.id)}</div>
        <div>
          <div class="detail-title">${group.name}</div>
          <div class="detail-sub">בחר תרגיל, בדוק את היעד להיום והזן את הביצוע.</div>
        </div>
      </div>

      <select class="exercise-select" id="exerciseSelect">
        <option value="">בחר תרגיל...</option>
        ${group.exercises.map(ex=>`<option value="${ex.id}" ${state.exerciseId===ex.id?'selected':''}>${ex.nameHe} · ${ex.name}</option>`).join('')}
      </select>

      <div id="exerciseArea" class="${state.exerciseId?'':'hidden'}"></div>
    </div>
  `;

  dashboard.classList.add('hidden');
  detail.classList.add('active');

  document.getElementById('backToDashboard').addEventListener('click',returnToDashboard);
  document.getElementById('exerciseSelect').addEventListener('change',e=>{
    const exId=e.target.value;
    if(!exId){
      workoutState[groupId]={};
      document.getElementById('exerciseArea').classList.add('hidden');
      return;
    }
    workoutState[groupId]={exerciseId:exId,completed:false};
    renderExerciseArea(groupId);
  });

  if(state.exerciseId)renderExerciseArea(groupId);
}

function renderExerciseArea(groupId){
  const area=document.getElementById('exerciseArea');
  const state=workoutState[groupId];
  const ex=exerciseById(state.exerciseId);
  const history=getExerciseHistory(ex.id);
  const last=history[0];
  const goal=getGoal(ex.id);

  const weightValue=state.weight ?? goal.weight ?? '';
  const repsValue=state.reps ?? goal.reps ?? '';
  const rpeValue=state.rpe ?? '';

  area.classList.remove('hidden');
  area.innerHTML=`
    <div class="info-grid">
      <div class="info-box previous-box">
        <div class="info-title">האימון הקודם בתרגיל זה</div>
        <div class="info-main">
          ${last
            ? `${ex.noWeight?'':`${last.weight} ${ex.weightLabel||'ק"ג'} · `}${last.reps} ${ex.repsLabel||'חזרות'} · RPE ${last.rpe}`
            : 'אין עדיין ביצוע קודם'}
        </div>
        <div class="info-note">${last?fmtDate(last.date):'זה יהיה נתון הבסיס הראשון.'}</div>
      </div>

      <div class="info-box goal-box">
        <div class="info-title">🎯 היעד להיום</div>
        <div class="info-main">${goal.text}</div>
        <div class="info-note">היעד מחושב לפי הביצועים הקודמים של תרגיל זה בלבד.</div>
      </div>
    </div>

    <div class="entry-title">הביצוע היום</div>
    <div class="entry-grid">
      <div class="entry-field ${ex.noWeight?'hidden':''}">
        <label>משקל</label>
        <input class="number-input" id="currentWeight" type="number" step="0.5" min="0" value="${weightValue}">
        <div class="unit">${ex.weightLabel||'ק"ג'}</div>
      </div>
      <div class="entry-field">
        <label>${ex.repsLabel||'חזרות'}</label>
        <input class="number-input" id="currentReps" type="number" step="1" min="1" value="${repsValue}">
        <div class="unit">${ex.repsLabel||'חזרות'}</div>
      </div>
      <div class="entry-field">
        <label>RPE נוכחי</label>
        <input class="number-input" id="currentRpe" type="number" step="1" min="1" max="10" value="${rpeValue}" placeholder="1–10">
        <div class="unit">מאמץ</div>
      </div>
    </div>

    <div class="live-rec rec-neutral" id="liveRec">הזן את כל הנתונים לקבלת המלצה להמשך.</div>

    <div class="detail-actions">
      <button class="btn btn-complete" id="completeGroupBtn">✓ סיימתי את ${ex.nameHe}</button>
      <button class="btn btn-secondary" id="saveDraftBtn">שמור וחזור בלי לסמן כהושלם</button>
    </div>
  `;

  ['currentWeight','currentReps','currentRpe'].forEach(id=>{
    document.getElementById(id)?.addEventListener('input',updateLiveRecommendation);
  });
  document.getElementById('completeGroupBtn').addEventListener('click',()=>finishGroup(true));
  document.getElementById('saveDraftBtn').addEventListener('click',()=>finishGroup(false));
  updateLiveRecommendation();
}

function readCurrentEntry(){
  const state=workoutState[currentGroupId];
  const ex=exerciseById(state.exerciseId);
  return {
    ex,
    weight:ex.noWeight?0:Number(document.getElementById('currentWeight')?.value||0),
    reps:Number(document.getElementById('currentReps')?.value||0),
    rpe:Number(document.getElementById('currentRpe')?.value||0)
  };
}

function updateLiveRecommendation(){
  const {ex,weight,reps,rpe}=readCurrentEntry();
  const rec=currentRecommendation(ex,{weight,reps,rpe});
  const box=document.getElementById('liveRec');
  box.textContent=rec.text;
  box.className=`live-rec ${rec.cls}`;
}

function finishGroup(markCompleted){
  const {ex,weight,reps,rpe}=readCurrentEntry();
  if(!reps){
    alert(`יש להזין ${ex.repsLabel||'מספר חזרות'}.`);return;
  }
  if(markCompleted){
    if(!ex.noWeight && weight<=0){alert('יש להזין משקל.');return}
    if(rpe<1||rpe>10){alert('יש להזין RPE בין 1 ל־10.');return}
  }

  const rec=currentRecommendation(ex,{weight,reps,rpe});
  workoutState[currentGroupId]={
    exerciseId:ex.id,
    weight,
    reps,
    rpe,
    recommendation:rec.text,
    completed:markCompleted
  };
  returnToDashboard();
}

function returnToDashboard(){
  document.getElementById('detailView').classList.remove('active');
  document.getElementById('dashboardView').classList.remove('hidden');
  currentGroupId=null;
  updateDashboard();
  window.scrollTo({top:0,behavior:'smooth'});
}

function saveWorkout(){
  const completedGroups=GROUPS.filter(g=>workoutState[g.id]?.completed);
  if(!completedGroups.length){
    alert('עדיין לא הושלם אף תרגיל.');return;
  }

  const exercises=completedGroups.map(group=>{
    const state=workoutState[group.id];
    const ex=exerciseById(state.exerciseId);
    return {
      exerciseId:ex.id,
      groupId:group.id,
      name:ex.name,
      nameHe:ex.nameHe,
      muscle:group.name,
      category:group.id,
      weight:ex.noWeight?0:Number(state.weight),
      reps:Number(state.reps),
      rpe:Number(state.rpe),
      repsLabel:ex.repsLabel||'חזרות',
      recommendation:state.recommendation||'',
      completed:true,
      isCore:group.id==='core',
      isFlexibility:false
    };
  });

  const ratingBtn=document.querySelector('.rating-dot.selected');
  const session={
    id:Date.now(),
    date:document.getElementById('sessionDate').value||todayStr(),
    workoutType:'FullBody',
    bodyWeight:Number(document.getElementById('bodyWeight').value)||null,
    bodyFat:Number(document.getElementById('bodyFat').value)||null,
    note:document.getElementById('sessionNote').value.trim(),
    rating:ratingBtn?Number(ratingBtn.dataset.value):null,
    exercises
  };

  const history=loadHistory();
  history.push(session);
  saveHistory(history);

  const msg=document.getElementById('saveMessage');
  msg.classList.add('show');
  setTimeout(()=>{
    workoutState={};
    renderWorkout();
    window.scrollTo({top:0,behavior:'smooth'});
  },900);
}

function renderHistory(){
  const panel=document.getElementById('panel-history');
  const history=loadHistory().sort((a,b)=>new Date(b.date)-new Date(a.date)||(b.id||0)-(a.id||0));

  const toolbar=`
    <div class="history-toolbar">
      <strong>${history.length} אימונים שמורים</strong>
      <div class="history-actions">
        <button class="btn btn-secondary" onclick="importJSON()">ייבוא JSON</button>
        <button class="btn btn-secondary" onclick="exportJSON()">ייצוא JSON</button>
        <button class="btn btn-secondary" onclick="exportExcel()">ייצוא Excel</button>
        <button class="btn btn-danger" onclick="clearHistory()">מחק הכל</button>
      </div>
    </div>`;

  if(!history.length){
    panel.innerHTML=toolbar+`<div class="empty">עדיין אין אימונים שמורים.</div>`;return;
  }

  panel.innerHTML=toolbar+history.map(session=>{
    const exs=(session.exercises||[]).filter(e=>!e.isFlexibility);
    const rpes=exs.map(e=>Number(e.rpe)).filter(v=>v>0);
    const avg=rpes.length?(rpes.reduce((a,b)=>a+b,0)/rpes.length).toFixed(1):'—';
    const rows=exs.map(raw=>{
      const ex=normalizeLegacyExercise(raw);
      return `<tr>
        <td><strong>${ex.nameHe||ex.name||''}</strong><br><span style="color:var(--muted)">${ex.name||''}</span></td>
        <td>${ex.weight||'—'}</td>
        <td>${ex.reps||'—'} ${ex.repsLabel||''}</td>
        <td>${ex.rpe||'—'}</td>
        <td>${ex.recommendation||'—'}</td>
      </tr>`;
    }).join('');
    const meta=[];
    if(session.bodyWeight)meta.push(`משקל גוף: <strong>${session.bodyWeight} ק"ג</strong>`);
    if(session.bodyFat)meta.push(`שומן: <strong>${session.bodyFat}%</strong>`);
    if(session.rating)meta.push(`דירוג: <strong>${session.rating}/5</strong>`);
    if(session.note)meta.push(`הערה: <strong>${session.note}</strong>`);

    return `<div class="history-card">
      <div class="history-head" onclick="toggleHistory('${session.id}')">
        <div class="history-left">
          <span class="history-badge">גוף מלא</span>
          <div>
            <div class="history-date">${fmtDate(session.date)}</div>
            <div class="history-stats">${exs.length} תרגילים · RPE ממוצע ${avg}</div>
          </div>
        </div>
        <strong style="color:var(--primary)">פתח</strong>
      </div>
      <div class="history-body" id="history-${session.id}">
        ${meta.length?`<div class="history-meta">${meta.map(x=>`<span>${x}</span>`).join('')}</div>`:''}
        <table class="history-table">
          <thead><tr><th>תרגיל</th><th>משקל</th><th>חזרות</th><th>RPE</th><th>המלצה</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
  }).join('');
}
function toggleHistory(id){document.getElementById(`history-${id}`)?.classList.toggle('open')}
function clearHistory(){
  if(confirm('למחוק את כל היסטוריית האימונים?')){
    localStorage.removeItem(STORAGE_KEY);renderHistory();
  }
}
function exportJSON(){
  const blob=new Blob([JSON.stringify(loadHistory(),null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=`gym-history-${todayStr()}.json`;a.click();URL.revokeObjectURL(url);
}
function importJSON(){
  const input=document.createElement('input');
  input.type='file';input.accept='.json,application/json';
  input.onchange=e=>{
    const file=e.target.files?.[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const incoming=JSON.parse(ev.target.result);
        if(!Array.isArray(incoming))throw new Error();
        const existing=loadHistory(),ids=new Set(existing.map(s=>s.id));
        const fresh=incoming.filter(s=>!ids.has(s.id));
        saveHistory([...existing,...fresh]);
        alert(`נוספו ${fresh.length} אימונים חדשים.`);
        renderHistory();
      }catch{alert('הקובץ אינו קובץ JSON תקין של האפליקציה.')}
    };
    reader.readAsText(file);
  };
  input.click();
}
function exportExcel(){
  const history=loadHistory().sort((a,b)=>new Date(a.date)-new Date(b.date));
  if(!history.length){alert('אין נתונים לייצוא');return}
  const rows=[];
  history.forEach(session=>{
    (session.exercises||[]).forEach(raw=>{
      const ex=normalizeLegacyExercise(raw);
      rows.push({
        'תאריך':session.date,
        'קבוצת שרירים':ex.muscle||ex.groupId||'',
        'תרגיל':ex.name||'',
        'שם עברית':ex.nameHe||'',
        'משקל':ex.weight??'',
        'חזרות/זמן':ex.reps??'',
        'יחידה':ex.repsLabel||'',
        'RPE':ex.rpe??'',
        'המלצה':ex.recommendation||'',
        'משקל גוף':session.bodyWeight??'',
        'שומן גוף':session.bodyFat??'',
        'דירוג אימון':session.rating??'',
        'הערה':session.note||''
      });
    });
  });
  if(typeof XLSX!=='undefined'){
    const ws=XLSX.utils.json_to_sheet(rows);
    ws['!cols']=[{wch:12},{wch:18},{wch:25},{wch:24},{wch:10},{wch:12},{wch:10},{wch:7},{wch:45},{wch:12},{wch:12},{wch:12},{wch:30}];
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'אימונים');
    XLSX.writeFile(wb,`gym-history-${todayStr()}.xlsx`);
  }else{
    const headers=Object.keys(rows[0]),esc=v=>`"${String(v).replace(/"/g,'""')}"`;
    const csv='\uFEFF'+[headers.map(esc).join(','),...rows.map(r=>headers.map(h=>esc(r[h])).join(','))].join('\n');
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=`gym-history-${todayStr()}.csv`;a.click();URL.revokeObjectURL(url);
  }
}

document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    const target=tab.dataset.tab;
    document.getElementById(`panel-${target}`).classList.add('active');
    if(target==='history')renderHistory();
  });
});

(function init(){
  const now=new Date();
  document.getElementById('headerDate').textContent=
    `${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()}`;
  renderWorkout();
})();
</script>
